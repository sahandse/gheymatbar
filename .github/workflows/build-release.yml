name: Build Plugin ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare plugin
        run: |
          mkdir -p build/gheymatbar
          rsync -av --exclude='.git' --exclude='.github' --exclude='build' ./ build/gheymatbar/

      - name: Create ZIP
        run: |
          cd build
          zip -r gheymatbar.zip gheymatbar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gheymatbar
          path: build/gheymatbar.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/gheymatbar.zip
          generate_release_notes: true
